<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Spring eCommerce — Iniciar sesión</title>
	<!-- Favicons -->
	<link
		href="https://images.unsplash.com/vector-1739805642241-db41b64805fb?q=80&w=880&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
		rel="icon" />
	<link
		href="https://images.unsplash.com/vector-1739805642241-db41b64805fb?q=80&w=880&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
		rel="apple-touch-icon" />

	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	<link rel="stylesheet" href="css/styles.css">
</head>

<body>

	<div class="login-wrapper">

		<button class="btn btn-icono position-absolute top-0 end-0 m-3" id="botonTemaLogin" type="button"
			aria-label="Cambiar tema">
			<i class="bi bi-sun-fill" id="iconoTemaLogin"></i>
		</button>

		<div class="card login-card">
			<div class="card-body p-4 p-md-5">

				<div class="text-center mb-4">
					<span class="marca-icono marca-icono-lg mx-auto mb-3">
						<i class="bi bi-bag-heart-fill"></i>
					</span>
					<h1 class="h4 fw-bold mb-1">Spring<span class="text-purple">eCommerce</span></h1>
					<p class="small texto-suave mb-0">Inicia sesión en tu cuenta</p>
				</div>

				<form id="formularioLogin" novalidate>
					<div class="mb-3">
						<label for="loginEmail" class="form-label">Correo electrónico</label>
						<input type="email" class="form-control" id="loginEmail" placeholder="tu@correo.com"
							autocomplete="email" required>
					</div>

					<div class="mb-3">
						<label for="loginPassword" class="form-label">Contraseña</label>
						<input type="password" class="form-control" id="loginPassword" placeholder="••••••••"
							autocomplete="current-password" required>
					</div>

					<div class="d-flex justify-content-between align-items-center mb-3 small">
						<div class="form-check">
							<input class="form-check-input" type="checkbox" id="recordarme">
							<label class="form-check-label" for="recordarme">Recordarme</label>
						</div>
						<a href="#" class="small">¿Olvidaste tu contraseña?</a>
					</div>

					<button type="submit" class="btn btn-primary w-100 py-2">
						<i class="bi bi-box-arrow-in-right me-2"></i>Entrar
					</button>

					<div class="alert alert-success d-none mt-3 mb-0" id="mensajeLogin" role="alert"></div>
				</form>

				<div class="text-center mt-4">
					<p class="small texto-suave mb-0">
						¿No tienes cuenta?
						<a href="registro.html" class="fw-semibold">Regístrate</a>
					</p>
				</div>

				<hr class="my-4">

				<div class="text-center">
					<a href="index.html" class="small me-3">
						<i class="bi bi-arrow-left me-1"></i>Volver a la tienda
					</a>
					<a href="registro.html" class="small me-3">
						Crear cuenta <i class="bi bi-person-plus ms-1"></i>
					</a>
					<a href="admin.html" class="small fw-semibold">
						Ir al panel <i class="bi bi-arrow-right ms-1"></i>
					</a>
				</div>

			</div>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script>
		(function () {
			let temaActual = 'dark';
			function aplicarTema(tema) {
				temaActual = tema;
				document.documentElement.setAttribute('data-bs-theme', tema);
				const icono = document.getElementById('iconoTemaLogin');
				if (icono) icono.className = tema === 'dark' ? 'bi bi-sun-fill' : 'bi bi-moon-stars-fill';
			}
			document.getElementById('botonTemaLogin')?.addEventListener('click', () => {
				aplicarTema(temaActual === 'dark' ? 'light' : 'dark');
			});
			aplicarTema('dark');

			const form = document.getElementById('formularioLogin');
			form?.addEventListener('submit', async (evento) => {
				evento.preventDefault();
				if (!form.checkValidity()) {form.classList.add('was-validated'); return;}
				const email = document.getElementById('loginEmail').value.trim();
				const password = document.getElementById('loginPassword').value;
				const aviso = document.getElementById('mensajeLogin');
				aviso.classList.add('d-none');
				try {
					const r = await fetch('/api/usuarios/login', {
						method: 'POST',
						headers: {'Content-Type': 'application/json'},
						body: JSON.stringify({email, password})
					});
					if (!r.ok) throw new Error('Credenciales inválidas');
					const usuario = await r.json();
					aviso.className = 'alert alert-success mt-3 mb-0';
					aviso.innerHTML = `
          ¡Bienvenido, <strong>${usuario.nombre}</strong>! (rol: ${usuario.rol})
          <br><a href="admin.html" class="btn btn-primary btn-sm mt-2">
            <i class="bi bi-speedometer2 me-1"></i>Ir al panel
          </a>`;
					aviso.classList.remove('d-none');
					form.classList.remove('was-validated');
				} catch (e) {
					aviso.className = 'alert alert-danger mt-3 mb-0';
					aviso.textContent = e.message;
					aviso.classList.remove('d-none');
				}
			});
		})();
	</script>
</body>

</html>
